# This files holds all reverse-substitution entries. These entries are target environment agnostic
# The format is <XPath>=%%VARIABLE%%
# In the XPath, spaces, equals signs and colons need to be escaped.
# In the XPath, spaces, equals signs and colons need to be escaped.
# i.e, space is '\ ', equals is '\=' and colon is '\:' (without the single quotes)
#
# So, for example, to replace the Active Directory username with a macro, do something like:
#
# /Application[@name\=Active\ Directory\ -\ NA']/Attributes/Map/entry[@key\='user']/@value=%%USERNAME%%
#

#######################################################
# Set Spacing during import
#######################################################
//text()[not(normalize-space())]


#######################################################
# Active Directory - PIM - Configuration
#######################################################

/Application[@name\='Active\ Directory\ -\ NA\ Testing']/@maintenanceExpiration=%%AD_NA_PIM_MAINTENANCE%%
/Application[@name\='Active\ Directory\ -\ NA\ Testing']/Attributes/Map/entry[@key\='group.searchDNs']/value=%%AD_NA_GS_PIM_SEARCHDNS%%
/Application[@name\='Active\ Directory\ -\ NA\ Testing']/Attributes/Map/entry[@key\='groupContainers']/value=%%AD_NA_PIM_GROUPCONTAINERS%%
/Application[@name\='Active\ Directory\ -\ NA\ Testing']/ProxyApplication/Reference[@class\='sailpoint.object.Application']/@name=%%AD_NA_PIM_PROXY_APPLICATION%%
/Application[@name\='Active\ Directory\ -\ NA\ Testing']/Attributes/Map/entry[@key\='beforeProvisioningRule']/@value=%%ACTIVEDIRECTORY-NA-PIM-BEFOREPROVISIONINGRULE%%
/Application[@name\='Active\ Directory\ -\ NA\ Testing']/Attributes/Map/entry[@key\='searchDNs']/value=%%AD_NA_PIM_SDN_SEARCHDNS%%
